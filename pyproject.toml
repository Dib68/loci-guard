[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loci-guard"
version = "0.2.0"
description = "Project memory, security shield and foresight for AI coding agents: remembers your rules where they apply, blocks insecure AI-written code, shares it all over MCP."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Loci Guard Contributors" }]
keywords = ["ai", "security", "code-analysis", "agent-skill", "project-memory", "claude-code", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "pathspec>=0.11",
]

[project.urls]
Homepage = "https://github.com/Dib68/loci-guard"
Issues = "https://github.com/Dib68/loci-guard/issues"
Changelog = "https://github.com/Dib68/loci-guard/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff"]

[project.scripts]
loci-guard = "loci_guard.entry:main"

[tool.hatch.build.targets.wheel]
packages = ["loci_guard"]

# The skill lives at skills/ (where skill collections expect it) and ships inside the package.
[tool.hatch.build.targets.wheel.force-include]
"skills/loci-guard" = "loci_guard/skill"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
