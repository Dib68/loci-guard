name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
        exclude:
          # macOS runners are scarce and queue for up to 15 minutes; one Python version there is enough.
          - os: macos-latest
            python: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint (pyflakes rules)
        run: python -m ruff check loci_guard tests --select F

      - name: Tests
        run: python -m pytest -q

      - name: Loci Guard scans itself
        run: loci-guard scan --json-output > self-scan.json && python -c "import json; r = json.load(open('self-scan.json', encoding='utf-8')); f = r['shield']['total_findings']; print(r['shield']['summary']); raise SystemExit(1 if f else 0)"
        shell: bash
